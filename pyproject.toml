[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iraqi-nlp"
version = "0.1.0"
description = "Iraqi Arabic NLP Toolkit for civic discourse analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "Hussein Hadi", email = "hussain.hade12345@gmail.com"}
]
keywords = [
  "arabic", "nlp", "iraqi-arabic", "corpus",
  "dialect", "computational-linguistics", "low-resource"
]
requires-python = ">=3.8"
dependencies = [
  "pandas",
  "numpy",
  "scikit-learn",
  "transformers",
  "torch",
  "camel-tools",
  "arabert",
  "tqdm",
  "jupyter",
  "regex",
  "nltk"
]

[project.urls]
Homepage = "https://github.com/hussainhade12345-max/Iraqi-Arabic-NLP-Toolkit-IANLP-"
Repository = "https://github.com/hussainhade12345-max/Iraqi-Arabic-NLP-Toolkit-IANLP-"

[tool.setuptools.packages.find]
where = ["."]
include = ["iraqi_nlp*"]