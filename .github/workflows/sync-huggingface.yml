name: Sync to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (preview only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  sync:
    name: Validate and Synchronize to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest huggingface_hub

      - name: Run test suite
        run: |
          pytest -v

      - name: Synchronize to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: "hussainhadi/Iraqi-Arabic-NLP-Toolkit-IANLP"
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/sync_to_huggingface.py --dry-run
          else
            python scripts/sync_to_huggingface.py
          fi
